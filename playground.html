<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUDAENG | Playground</title>

    <!-- Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">NUDAENG.</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="subscribe.html">Subscribe</a></li>
            <li><a href="#" class="active" style="color: var(--accent-orange); font-weight: 700;">Playground</a></li>
        </ul>
    </nav>

    <!-- Header Section -->
    <section class="sub-header">
        <div class="container text-center">
            <h1 data-aos="fade-up">누댕이 인터랙티브 놀이터</h1>
            <p data-aos="fade-up" data-aos-delay="100">이곳저곳 마우스로 클릭하고 쓰다듬으며 누댕이와 놀아보세요!</p>
        </div>
    </section>

    <!-- Playground Section -->
    <section class="playground-section">
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;">

                <!-- 1. 간식 주기 -->
                <div class="play-card" data-aos="fade-up" data-aos-delay="100">
                    <h2>누댕이 밥 주기</h2>
                    <p>버튼을 눌러 맛있는 음식들을 투척해 보세요! (1회 투척 시 10 코인 소모)</p>
                    <div style="font-weight: bold; font-size: 1.2rem; color: #D97736; margin-bottom: 15px;">
                        현재 보유 재화: <span id="coin-count">200</span> 누댕코인
                    </div>
                    <button class="cta-button" id="btn-feed">간식 투척! (-10 코인)</button>
                    <button class="cta-button outline" id="btn-clear-feed">그릇 비우기</button>

                    <div class="snack-bowl mt-20" style="text-align: center;">
                        <img id="reaction-img" src="images/interactive/ing.png" alt="Nudaeng Reaction"
                            style="max-height: 120px; margin-bottom: 15px; border-radius: 10px; object-fit: contain;">
                        <ul id="snack-list" style="text-align: left;">
                            <li>밥주세유</li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 NUDAENG.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        /* =========================================
           jQuery Scripts
           ========================================= */
        $(document).ready(function () {

            // 1. DOM 조작 (HTML 추가/삭제)
            let snackCount = 0;
            let coinCount = 200; // 초기 재화

            $("#btn-feed").click(function () {
                if (coinCount < 10) {
                    alert("누댕코인이 부족합니다! 결제 페이지로 이동합니다.");
                    window.location.href = "subscribe.html";
                    return;
                }

                coinCount -= 10;
                $("#coin-count").text(coinCount);

                if (snackCount === 0) {
                    $("#snack-list").empty(); // 첫 간식 줄 때 빈 그릇 메시지 삭제
                }
                const foodMenu = [
                    { name: '나쵸', reaction: '퉤퉤 이게 뭐에윸!!!', img: 'images/interactive/bad.png' },
                    { name: '갈비탕', reaction: '이거 괜찮네유.', img: 'images/interactive/good.png' },
                    { name: '피자', reaction: '챱챱챱챱챱', img: 'images/interactive/love.png' },
                    { name: '수제버거', reaction: '챱챱챱챱챱', img: 'images/interactive/love.png' },
                    { name: '양념치킨', reaction: '챱챱챱챱챱', img: 'images/interactive/love.png' },
                    { name: '마라탕', reaction: '이잉??', img: 'images/interactive/bad.png' },
                    { name: '연어초밥', reaction: '이거 괜찮네유.', img: 'images/interactive/good.png' },
                    { name: '다이어트 샐러드', reaction: '예?', img: 'images/interactive/ye.png' },
                    { name: '한우 꽃등심', reaction: '챱챱챱챱챱', img: 'images/interactive/love.png' },
                    { name: '아메리카노', reaction: '퉤퉤 이게 뭐에윸!!!', img: 'images/interactive/bad.png' },
                    { name: '탕후루', reaction: '이거 괜찮네유.', img: 'images/interactive/good.png' }
                ];
                const randomFood = foodMenu[Math.floor(Math.random() * foodMenu.length)];

                // 이미지 변경
                $("#reaction-img").attr("src", randomFood.img);

                // append()로 리스트 맨 끝에 추가
                $("#snack-list").append("<li><strong>" + randomFood.name + "</strong> 투척! ➡️ " + randomFood.reaction + "</li>");
                snackCount++;
            });

            $("#btn-clear-feed").click(function () {
                // 이미지 초기화
                $("#reaction-img").attr("src", "images/interactive/ing.png");
                // empty()로 내부 요소 모두 삭제 후 초기화
                $("#snack-list").empty().append("<li>밥주세유</li>");
                snackCount = 0;
            });

        });
    </script>
</body>

</html>
