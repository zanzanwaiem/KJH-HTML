<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 메인 홈</title>
    <style>
        /* ✨ 1. 구글 폰트(노토 산스 KR) 불러오기! (굵기 400, 500, 700 포함) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        /* 전체 배경 및 기본 폰트 설정 */
        body {
            /* ✨ 2. 폰트 이름을 'Noto Sans KR'로 변경! */
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.7;
            color: #333;
            background-color: #faf7f4;
            margin: 0;
            padding: 40px 20px;
            word-break: keep-all;
        }

        /* 콘텐츠를 감싸는 중앙 정렬 박스 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #2c2a2a;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #705a4e;
            /* 차분한 따뜻한 회갈색 */
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #eadbc8;
            /* 연한 황갈색 구분선 */
            margin: 30px 0;
        }

        /* 수업 목록 버튼(카드) 스타일 */
        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-card {
            display: block;
            padding: 25px;
            background-color: #ffffff;
            border: 2px solid #fff3e0;
            /* 아주 연한 복숭아빛 주황색 테두리 */
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .lesson-card:hover {
            background-color: #fffaf5;
            /* 마우스 올렸을 때 따뜻한 배경색 */
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.1);
            /* 연한 주황빛 그림자 */
            border-color: #ffe0b2;
            /* 더 따뜻한 주황색 테두리 */
        }

        .lesson-date {
            font-weight: bold;
            color: #e65100;
            /* 깊고 진한 주황색 포인트 */
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .lesson-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4a4143;
            margin: 0;
        }

        /* 아직 안 열린 수업(잠금) 스타일 */
        .locked-card {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .locked-card:hover {
            transform: none;
            box-shadow: none;
            background-color: #ffffff;
            border-color: #fff3e0;
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .lesson-card {
                padding: 20px;
            }

            .lesson-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

            </a>

            </a>

            <a href="lesson-0406.html" class="lesson-card">

            </a>

            <a href="lesson-0413.html" class="lesson-card">

    </div>
</body>

</html>
