<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 수업: js 활용</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>

    <script>
        function calc() {
            var result = parseInt(document.myform.x.value) + parseInt(document.myform.y.value);
            document.myform.sum.value = result;
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        /* 전체 배경 및 기본 폰트 설정 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.7;
            color: #333;
            background-color: #faf7f4;
            margin: 0;
            padding: 40px 20px;
            word-break: keep-all;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #705a4e;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c2a2a;
            font-size: 2rem;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f4d1a0;
        }

        /* ✨ 2. p5.js 캔버스가 들어갈 박스 스타일 */
        #canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            /* 캔버스 가운데 정렬 */
            margin: 30px 0;
            background-color: #fcf8f5;
            border-radius: 12px;
            overflow: hidden;
            /* 캔버스가 박스를 나가지 않게 */
            border: 1px solid #eadbc8;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a4143;
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #eadbc8;
            padding-bottom: 8px;
        }

        .back-btn-container {
            text-align: center;
            margin-top: 60px;
        }

        .back-btn {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: #ffe0b2;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>


<body>
    <div class="container">
        <h1>오늘의 수업은??</h1>
        <h2>p5.js 코드 이식</h2>

        <BUTTON type="button" onclick="alert('화면에 마우스나 손가락 터치로 상호작용 해보세요!!')">이용하시는 방법</BUTTON>
        <script>
            var age = prompt("나이를 입력해주세요", "만나이로 입력합니다.");
            if (age < 18) {
                alert('성인이 아닙니다! 응애!');
            } else {
                alert('성인입니다!');
            }
        </script>

        <script>
            var tan = prompt("김영민의 생일은?", "n월n일의 형식으로 쓰십쇼.");
            if (tan === "7월4일") {
                alert('감사합니다!');
            } else {
                alert('흠..');
            }
        </script>

        <script>
            var i = 0;
            for (i = 0; i < 3; i++) {
                alert("카운터 : " + i);
            }
        </script>

        <form name="myform" action="..." method="POST">
            첫번째 정수:
            <input id="x" name="x" /><br />
            두번째 정수:
            <input id="y" name="y" /><br />
            합계:
            <input id="sum" name="sum" /><br />
            <input type="button" value="계산" onclick="calc();" />
        </form>

        <table border="4">
            <tr>
                <td>섭씨온도</td>
                <td>화씨온도</td>
            </tr>
            <script>
                for (celsius = 0; celsius <= 35; celsius = celsius + 5) {
                    document.write("<tr><td>" + celsius + "</td><td>" + ((celsius * 9.0 / 5) + 32) + "</td></tr>");
                }
            </script>
        </table>




        <div class="section-title">영원한 꽃</div>
        <iframe src="frame-sketch.html" width="100%" height="600"
            style="border: none; border-radius: 12px; background-color: #000;"></iframe>
        <p>마우스로 꽃을 심어보세요..</p>

        <div class="section-title">가을녘</div>
        <iframe src="frame-fall.html" width="100%" height="600"
            style="border: none; border-radius: 12px; background-color: #000;"></iframe>
        <p>바람이 되어보세요 호호..</p>

        <div class="section-title">와!</div>
        
        <iframe src="https://jcw87.github.io/c2-sans-fight/" width="100%" height="600"
            style="border: none; border-radius: 12px; background-color: #000;"></iframe>
            
        <p>샌즈! (게임을 시작하려면 까만 화면을 한 번 클릭해서 선택해 주세요) 조작키 = z, 방향키 </p>

        <div class="back-btn-container">
            <a href="index.html" class="back-btn">🏠 메인 홈으로 돌아가기</a>
        </div>
    </div>

</body>

</html>
