<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘은 고양이</title>
    <style>
        /* ✨ 1. 구글 폰트(노토 산스 KR) 불러오기! (굵기 400, 500, 700 포함) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        /* 전체 배경 및 기본 폰트 설정 (0323 테마) */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.7;
            color: #333;
            background-color: #faf7f4; /* 아주 연한 크림빛/아이보리 배경 */
            margin: 0;
            padding: 40px 20px;
            word-break: keep-all;
        }

        /* 콘텐츠를 감싸는 중앙 정렬 박스 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* 제목 스타일링 (0323 테마 일치) */
        h1 {
            color: #705a4e;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c2a2a;
            font-size: 2rem;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f4d1a0;
        }

        /* 소제목(섹션 타이틀) 스타일링 */
        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4a4143;
            margin-top: 50px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #eadbc8;
            padding-bottom: 8px;
        }

        /* 강조 및 본문 텍스트 */
        mark {
            background-color: #fff3e0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #e65100;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        ul, ol {
            padding-left: 25px;
            margin-bottom: 30px;
        }

        li {
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        /* 하이퍼링크 스타일링 (주황색 포인트) */
        a {
            color: #e65100;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        a:hover {
            color: #bf360c;
            text-decoration: underline;
        }

        /* 구분선 스타일 */
        hr {
            border: 0;
            height: 1px;
            background-color: #eadbc8;
            margin: 40px 0;
        }

        /* 돌아가기 버튼 스타일 (0323 테마) */
        .back-btn-container {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #ffe0b2;
            color: #bf360c;
            text-decoration: none;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(230, 81, 0, 0.2);
        }

        /* ✨ 반응형 이미지 맵 스타일 ✨ */
        .image-map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .image-map-container img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .click-area {
            position: absolute;
            border-radius: 8px;
            text-decoration: none;
            border: 2px dashed rgba(230, 81, 0, 0.6);
            transition: background-color 0.3s;
        }

        .click-area:hover {
            background-color: rgba(230, 81, 0, 0.2);
        }

        .area-face { top: 70%; left: 30%; width: 20%; height: 20%; }
        .area-body { top: 40%; left: 55%; width: 30%; height: 30%; }
        .area-foot { top: 80%; left: 80%; width: 15%; height: 15%; }

        /* 피규어 및 캡션 */
        figure {
            margin: 0 0 30px 0;
            text-align: center;
        }

        figcaption {
            color: #705a4e;
            font-size: 0.95rem;
            margin-top: 10px;
            background-color: #faf5f0;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* ✨ 폼(Form) 요소들을 0323 테마에 맞춰 예쁘게 스타일링 ✨ */
        form {
            background-color: #faf5f0;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #eadbc8;
        }

        fieldset {
            border: 1px solid #eadbc8;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            background-color: #ffffff;
        }

        legend {
            font-weight: bold;
            color: #e65100;
            background-color: #fff3e0;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 1.05rem;
        }

        form ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        form li {
            margin-bottom: 15px;
        }

        label {
            color: #4a4143;
            font-weight: 600;
            margin-right: 10px;
            display: inline-block;
            min-width: 100px;
        }

        input[type="text"], input[type="password"], input[type="number"], 
        input[type="tel"], input[type="date"], input[type="time"], 
        input[type="datetime-local"], select {
            padding: 10px 12px;
            border: 1px solid #eadbc8;
            border-radius: 6px;
            font-family: 'Noto Sans KR', sans-serif;
            color: #333;
            background-color: #ffffff;
            transition: border-color 0.3s;
            width: calc(100% - 130px); /* 모바일에서도 잘 맞도록 계산 */
            max-width: 300px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e65100;
            box-shadow: 0 0 5px rgba(230, 81, 0, 0.2);
        }

        input[type="submit"], input[type="reset"], button {
            background-color: #fff3e0;
            color: #e65100;
            border: none;
            padding: 10px 25px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
            margin-right: 10px;
        }

        input[type="submit"]:hover, input[type="reset"]:hover {
            background-color: #ffe0b2;
            color: #bf360c;
            transform: translateY(-2px);
        }

        input[type="radio"], input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #e65100; /* 체크박스/라디오 색상을 주황색으로 */
        }

        /* 모바일 기기 최적화 */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .container { padding: 30px 20px; border-radius: 12px; }
            h2 { font-size: 1.6rem; }
            .section-title { font-size: 1.2rem; }
            label { display: block; margin-bottom: 5px; }
            input[type="text"], input[type="password"], input[type="number"], 
            input[type="tel"], input[type="date"], input[type="time"], 
            input[type="datetime-local"], select {
                width: 100%;
                box-sizing: border-box;
            }
            .back-btn { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
