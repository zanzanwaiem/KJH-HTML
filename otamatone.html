<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누댕마톤 (Nudaeng-matone)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4A2C18;
            /* 가을 웜톤 배경 */
            color: #FFF5EC;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            /* 모바일 하단바 대응 */
            overflow: hidden;
            touch-action: none;
            /* 드래그 시 화면 스크롤 방지 */
        }

        .header {
            margin-top: 30px;
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            font-size: 3rem;
            color: #F2A65A;
            text-shadow: 2px 2px 0px #000;
        }

        .header p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #D97736;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 1);
            transition: transform 0.1s;
            z-index: 20;
        }

        .back-button:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px rgba(0, 0, 0, 1);
        }

        /* 누댕마톤 컨테이너 */
        .matone-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            height: 70vh;
            justify-content: flex-end;
            padding-bottom: 20px;
            /* 모바일 하단 여백 추가 */
        }

        /* 음정 바 (Stem) */
        .stem-container {
            width: 40px;
            height: 40vh;
            /* 고정픽셀(400px)에서 뷰포트 비율로 변경 */
            min-height: 250px;
            max-height: 400px;
            background: #2C1A0E;
            border: 4px solid #000;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.5);
            margin-bottom: -20px;
            /* 얼굴과 겹치게 */
            z-index: 1;
        }

        .stem-touch-area {
            position: absolute;
            top: 0;
            left: -30px;
            /* 터치 영역 확대 */
            right: -30px;
            bottom: 0;
            z-index: 2;
        }

        .stem-indicator {
            position: absolute;
            left: -10px;
            width: 52px;
            height: 20px;
            background: #D97736;
            border: 3px solid #000;
            border-radius: 10px;
            pointer-events: none;
            transform: translateY(-50%);
            top: 50%;
            transition: top 0.05s ease-out;
        }

        /* 누댕이 얼굴 (Face) */
        .face {
            width: 150px;
            height: 150px;
            background-color: #FDFCF9;
            background-image: url('images/nutamatone/nnn.png');
            background-size: cover;
            background-position: center;
            border: 6px solid #000;
            border-radius: 50%;
            position: relative;
            z-index: 3;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        .face.playing {
            transform: scale(1.05);
        }

        /* 눈, 입 (nnn.png 이미지를 사용하므로 기존 CSS 도형은 숨김) */
        .eye,
        .mouth {
            display: none;
        }

        /* 모바일 반응형 처리 */
        @media (max-width: 600px) {
            .header {
                margin-top: 70px;
                /* 뒤로가기 버튼과 겹침 방지 */
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .header p {
                font-size: 0.95rem;
                padding: 0 20px;
                word-break: keep-all;
            }

            .face {
                width: 130px;
                height: 130px;
            }

            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 0.9rem;
            }

            .matone-container {
                height: 65vh;
                /* 화면 높이에 맞게 조절 */
            }
        }

        /* 오디오 파일 안내 (제거) */
    </style>
</head>

<body>
    <a href="index.html" class="back-button">← 뒤로가기</a>

    <div class="header">
        <h1>누댕마톤</h1>
        <p>바를 드래그하여 누댕이의 목소리로 음계를 연주하세요!</p>
    </div>

    <div class="matone-container">
        <!-- 음정 조절 바 -->
        <div class="stem-container" id="stem">
            <div class="stem-indicator" id="indicator"></div>
            <div class="stem-touch-area" id="touchArea"></div>
        </div>

        <!-- 얼굴 -->
        <div class="face" id="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- 업로드 폼 제거됨 -->

    <script>
        const touchArea = document.getElementById('touchArea');
        const indicator = document.getElementById('indicator');
        const face = document.getElementById('face');

        let audioCtx = null;
        let sourceNode = null;
        let audioBuffer = null;
        let isPlaying = false;
        let isInitializing = false;

        // 1. 오디오 초기화 및 파일 로드 (가장 안전한 방식)
        function initAudio() {
            return new Promise((resolve, reject) => {
                if (audioBuffer) {
                    resolve();
                    return;
                }

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // 파일 가져오기
                fetch('nutamatone.wav')
                    .then(response => {
                        if (!response.ok) throw new Error("Network response was not ok");
                        return response.arrayBuffer();
                    })
                    .then(arrayBuffer => {
                        // 사파리 호환성을 위해 콜백 방식 사용
                        audioCtx.decodeAudioData(arrayBuffer, function (buffer) {
                            audioBuffer = buffer;
                            resolve();
                        }, function (e) {
                            console.error("Decode error", e);
                            reject(e);
                        });
                    })
                    .catch(e => {
                        console.error("Fetch error", e);
                        reject(e);
                    });
            });
        }

        // 2. 소리 재생
        function startSound(yRatio) {
            if (isInitializing) return;

            // 아직 로드되지 않은 경우 초기화
            if (!audioBuffer) {
                isInitializing = true;
                indicator.style.background = "#FF0000"; // 로딩 중 표시 (빨간색)
                initAudio().then(() => {
                    isInitializing = false;
                    indicator.style.background = "#D97736"; // 로딩 완료 복구
                    if (isPlaying) { // 사용자가 여전히 누르고 있다면
                        playSource(yRatio);
                    }
                }).catch(() => {
                    isInitializing = false;
                    alert("소리 로드에 실패했습니다. 파일이 있는지 확인해주세요.");
                });
                return;
            }

            playSource(yRatio);
        }

        // 실제 소스 재생 로직
        function playSource(yRatio) {
            if (sourceNode) {
                try { sourceNode.stop(); } catch (e) { }
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true;
            sourceNode.connect(audioCtx.destination);

            updatePitch(yRatio);
            sourceNode.start(0);

            face.classList.add('playing');
        }

        // 3. 소리 멈춤
        function stopSound() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch (e) { }
                sourceNode = null;
            }
            isPlaying = false;
            face.classList.remove('playing');
        }

        // 4. Y축 위치에 따른 음정 조절 (PlaybackRate 사용)
        function updatePitch(yRatio) {
            if (sourceNode && sourceNode.playbackRate) {
                // 0.5배속(낮은음) ~ 2.0배속(높은음)
                const rate = 0.5 + (1 - yRatio) * 1.5;
                sourceNode.playbackRate.value = rate;
            }
        }

        // 5. 상호작용 핸들러
        function handleInteraction(e) {
            e.preventDefault(); // 스크롤 방지

            // 모바일 사파리 필수: 상호작용 즉시 resume
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            let clientY;
            if (e.touches) {
                clientY = e.touches[0].clientY;
            } else {
                clientY = e.clientY;
            }

            const rect = touchArea.getBoundingClientRect();
            let y = clientY - rect.top;
            if (y < 0) y = 0;
            if (y > rect.height) y = rect.height;

            let yRatio = y / rect.height;

            indicator.style.top = (yRatio * 100) + '%';

            if (!isPlaying) {
                isPlaying = true;
                startSound(yRatio);
            } else {
                updatePitch(yRatio);
            }
        }

        function endInteraction(e) {
            e.preventDefault();
            stopSound();
        }

        // 마우스 이벤트
        touchArea.addEventListener('mousedown', handleInteraction);
        window.addEventListener('mousemove', (e) => {
            if (isPlaying) handleInteraction(e);
        });
        window.addEventListener('mouseup', endInteraction);

        // 터치 이벤트
        touchArea.addEventListener('touchstart', handleInteraction, { passive: false });
        touchArea.addEventListener('touchmove', handleInteraction, { passive: false });
        touchArea.addEventListener('touchend', endInteraction);
        touchArea.addEventListener('touchcancel', endInteraction);

    </script>
</body>

</html>
