<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누댕마톤 (Nudaeng-matone)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4A2C18; /* 가을 웜톤 배경 */
            color: #FFF5EC;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* 드래그 시 화면 스크롤 방지 */
        }
        .header {
            margin-top: 30px;
            text-align: center;
            z-index: 10;
        }
        .header h1 {
            font-size: 3rem;
            color: #F2A65A;
            text-shadow: 2px 2px 0px #000;
        }
        .header p {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #D97736;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
            transition: transform 0.1s;
        }
        .back-button:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px rgba(0,0,0,1);
        }

        /* 누댕마톤 컨테이너 */
        .matone-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            height: 70vh;
            justify-content: flex-end;
        }

        /* 음정 바 (Stem) */
        .stem-container {
            width: 40px;
            height: 400px;
            background: #2C1A0E;
            border: 4px solid #000;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            margin-bottom: -20px; /* 얼굴과 겹치게 */
            z-index: 1;
        }
        .stem-touch-area {
            position: absolute;
            top: 0;
            left: -30px; /* 터치 영역 확대 */
            right: -30px;
            bottom: 0;
            z-index: 2;
        }
        .stem-indicator {
            position: absolute;
            left: -10px;
            width: 52px;
            height: 20px;
            background: #D97736;
            border: 3px solid #000;
            border-radius: 10px;
            pointer-events: none;
            transform: translateY(-50%);
            top: 50%;
            transition: top 0.05s ease-out;
        }

        /* 누댕이 얼굴 (Face) */
        .face {
            width: 150px;
            height: 150px;
            background-color: #FDFCF9;
            background-image: url('nnn.png');
            background-size: cover;
            background-position: center;
            border: 6px solid #000;
            border-radius: 50%;
            position: relative;
            z-index: 3;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .face.playing {
            transform: scale(1.05);
        }

        /* 눈, 입 (nnn.png 이미지를 사용하므로 기존 CSS 도형은 숨김) */
        .eye, .mouth {
            display: none;
        }

        /* 오디오 파일 안내 (제거) */
    </style>
</head>
<body>
    <a href="index.html" class="back-button">← 뒤로가기</a>

    <div class="header">
        <h1>누댕마톤 🎵</h1>
        <p>바를 드래그하여 누댕이의 목소리로 음계를 연주하세요!</p>
    </div>

    <div class="matone-container">
        <!-- 음정 조절 바 -->
        <div class="stem-container" id="stem">
            <div class="stem-indicator" id="indicator"></div>
            <div class="stem-touch-area" id="touchArea"></div>
        </div>
        
        <!-- 얼굴 -->
        <div class="face" id="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- 업로드 폼 제거됨 -->

    <script>
        const touchArea = document.getElementById('touchArea');
        const indicator = document.getElementById('indicator');
        const face = document.getElementById('face');

        let audioCtx;
        let sourceNode;
        let audioBuffer = null;
        let audioArrayBuffer = null;
        let isPlaying = false;

        // 1. 페이지 로드 시 오디오 파일 미리 가져오기
        window.onload = () => {
            fetch('nutamatone.wav')
                .then(res => res.arrayBuffer())
                .then(buf => { audioArrayBuffer = buf; })
                .catch(e => console.error("Audio fetch error:", e));
        };

        // 2. 상호작용 시 오디오 컨텍스트 초기화 및 디코딩
        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // 브라우저 정책상 사용자 인터랙션 이후에 resume 필요
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            if (!audioBuffer && audioArrayBuffer) {
                try {
                    // 원본 ArrayBuffer를 유지하기 위해 복사본 사용
                    audioBuffer = await audioCtx.decodeAudioData(audioArrayBuffer.slice(0));
                } catch (e) {
                    console.error("Audio decode error:", e);
                }
            }
        }

        // 3. 소리 재생 및 정지
        async function startSound(yRatio) {
            await initAudio();
            if (!audioBuffer) return; // 로드 실패 시 무시
            
            if (sourceNode) {
                sourceNode.stop();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true; // 소리 반복
            sourceNode.connect(audioCtx.destination);
            
            updatePitch(yRatio);
            sourceNode.start(0);
            
            isPlaying = true;
            face.classList.add('playing');
        }

        function stopSound() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode = null;
            }
            isPlaying = false;
            face.classList.remove('playing');
        }

        // 4. Y축 위치에 따른 음정 조절 (PlaybackRate 사용)
        function updatePitch(yRatio) {
            if (sourceNode) {
                const rate = 0.5 + (1 - yRatio) * 1.5;
                sourceNode.playbackRate.value = rate;
            }
        }

        // 5. 이벤트 핸들러 처리
        function handleInteraction(e) {
            e.preventDefault(); // 스크롤 방지
            
            let clientY;
            if (e.touches) {
                clientY = e.touches[0].clientY;
            } else {
                clientY = e.clientY;
            }

            const rect = touchArea.getBoundingClientRect();
            // 바 안에서의 상대적 Y 위치 (0 ~ 1)
            let y = clientY - rect.top;
            if (y < 0) y = 0;
            if (y > rect.height) y = rect.height;
            
            let yRatio = y / rect.height;

            // 시각적 인디케이터 이동
            indicator.style.top = (yRatio * 100) + '%';

            if (!isPlaying) {
                startSound(yRatio);
            } else {
                updatePitch(yRatio);
            }
        }

        function endInteraction(e) {
            e.preventDefault();
            stopSound();
        }

        // 마우스 이벤트
        touchArea.addEventListener('mousedown', handleInteraction);
        window.addEventListener('mousemove', (e) => {
            if (isPlaying) handleInteraction(e);
        });
        window.addEventListener('mouseup', endInteraction);

        // 터치 이벤트
        touchArea.addEventListener('touchstart', handleInteraction, {passive: false});
        touchArea.addEventListener('touchmove', handleInteraction, {passive: false});
        touchArea.addEventListener('touchend', endInteraction);
        touchArea.addEventListener('touchcancel', endInteraction);

    </script>
</body>
</html>
