<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 수업: ㅇㅇㅇㅇ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

/* 전체 배경 및 기본 폰트 설정 (0323 테마) */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.7;
            color: #333;
            background-color: #faf7f4; /* 아주 연한 크림빛/아이보리 배경 */
            margin: 0;
            padding: 40px 20px;
            word-break: keep-all;
        }
        /* 콘텐츠를 감싸는 중앙 정렬 박스 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .accent{
            font-variant: small-caps;
            font-weight: bold;
            color:#107231a1;
            background-color: #faf0e6; /* 아주 연한 리넨/베이지 배경 */
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 8px;
            display: inline-block;
        }

        .back-btn-container {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #ffe0b2;
            color: #bf360c;
            text-decoration: none;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(230, 81, 0, 0.2);
        }

        p#txt{font-style:normal;}

        h1 {
            color: #705a4e;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c2a2a;
            font-size: 2rem;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f4d1a0;
        }

         /* 리스트 스타일링 */
         ul, ol {
            padding-left: 25px;
            margin-bottom: 30px;
        }

        li {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        /* 리스트 안의 철학자 이름 강조 스타일 */
        li b {
            font-variant: small-caps;
            font-weight: bold;
            color:#107231a1;
            background-color: #faf0e6; /* 아주 연한 리넨/베이지 배경 */
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1> 오늘은??</h1>

            <li><p><b>나고야(Nagoya)</b>, 일본</p></li>
            <li><P><b>도쿄(Tokyo)</b>, 일본</P></li>
            <li><p><span style="text-decoration: line-through"><b>서울(Seoul)</b> 대한민국</span></p></li>
        </ul>
        <div class="back-btn-container">
            <a href="setup-finish.html" class="back-btn">🏠 메인 홈으로 돌아가기</a>
        </div>
    </div>
</body>
